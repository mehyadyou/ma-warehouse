[databases]
ma_warehouse = host=postgres port=5432 dbname=ma_warehouse
ma_warehouse_staging = host=postgres port=5432 dbname=ma_warehouse_staging

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir = /tmp
user = postgres
auth_file = /etc/pgbouncer/userlist.txt
auth_type = scram-sha-256
# عمداً session (نه transaction): درایور pg از prepared statement استفاده می‌کند و
# transaction-mode بدون غیرفعال‌کردن آن‌ها (pgbouncer=true) کوئری‌ها را می‌شکند.
# اگر روزی به transaction-mode رفتید، اول ?pgbouncer=true را در URL و تست بار را چک کنید.
pool_mode = session
max_client_conn = 200
default_pool_size = 30
reserve_pool_size = 5
reserve_pool_timeout = 3
ignore_startup_parameters = extra_float_digits
admin_users = postgres
server_tls_sslmode = require
client_tls_sslmode = require
client_tls_key_file = /var/lib/postgresql/data/server.key
client_tls_cert_file = /var/lib/postgresql/data/server.crt
